version: '3.8'

services:
  postgres:
    image: postgres:13-alpine
    container_name: crapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - crapi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:4.4
    container_name: crapi-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo-data:/data/db
    networks:
      - crapi-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: crapi-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - crapi-network

  identity:
    image: owasp/crapi-identity:latest
    container_name: crapi-identity
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=crapi
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - MAILHOG_HOST=mailhog
      - MAILHOG_PORT=1025
      - JWT_SECRET=crapi
      - LOG_LEVEL=INFO
    networks:
      - crapi-network

  community:
    image: owasp/crapi-community:latest
    container_name: crapi-community
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      identity:
        condition: service_started
    environment:
      - MONGO_DB_HOST=mongo
      - MONGO_DB_PORT=27017
      - MONGO_DB_USER=admin
      - MONGO_DB_PASSWORD=admin123
      - IDENTITY_SERVICE=http://identity:8080
      - LOG_LEVEL=INFO
    networks:
      - crapi-network

  workshop:
    image: owasp/crapi-workshop:latest
    container_name: crapi-workshop
    restart: unless-stopped
    depends_on:
      - mongo
      - identity
    environment:
      - MONGO_DB_HOST=mongo
      - MONGO_DB_PORT=27017
      - MONGO_DB_USER=admin
      - MONGO_DB_PASSWORD=admin123
      - IDENTITY_SERVICE=http://identity:8080
      - LOG_LEVEL=INFO
    networks:
      - crapi-network

  chatbot:
    image: owasp/crapi-chatbot:latest
    container_name: crapi-chatbot
    restart: unless-stopped
    depends_on:
      - mongo
      - identity
    environment:
      - MONGO_DB_HOST=mongo
      - MONGO_DB_PORT=27017
      - MONGO_DB_USER=admin
      - MONGO_DB_PASSWORD=admin123
      - IDENTITY_SERVICE=http://identity:8080
      - LOG_LEVEL=INFO
    networks:
      - crapi-network

  api-gateway:
    image: owasp/crapi-api-gateway:latest
    container_name: crapi-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      identity:
        condition: service_started
      community:
        condition: service_started
      workshop:
        condition: service_started
    environment:
      - IDENTITY_SERVICE=http://identity:8080
      - COMMUNITY_SERVICE=http://community:8087
      - WORKSHOP_SERVICE=http://workshop:8000
      - LOG_LEVEL=INFO
    networks:
      - crapi-network

  web:
    image: owasp/crapi-web:latest
    container_name: crapi-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
    networks:
      - crapi-network

networks:
  crapi-network:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
